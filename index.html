<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5b">
<meta name="description" content="Kućni budžet: kupovina, računi, kuhinja i analiza troškova.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kućni Trošak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: jedna kolona za telefon (max 560px), saldo kao „knjiga“ na vrhu, donja navigacija za palac. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --fg: #15201d; --muted: #5d6b67; --line: #d8e0dd;
  --accent: #0d6b5b; --accent-fg: #ffffff; --accent-soft: #dcefe9;
  --neg: #b4261a; --pos: #1d7a3e; --warn: #9a5b00; --warn-soft: #fbefd9; --vice: #8a2f6b; --vice-soft: #f6e3f0;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", system-ui, sans-serif;
  --font-num: var(--font-body);
  --radius: 12px;
  --chart-rest: #2b7fa8; --chart-vice: #c2560c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #16201d; --fg: #e3ebe8; --muted: #93a39e; --line: #26332f;
  --accent: #46c2a6; --accent-fg: #06201a; --accent-soft: #163a32;
  --chart-rest: #3d8fc0; --chart-vice: #d9742a;
  --neg: #ff8a7a; --pos: #6fd08f; --warn: #f0b45a; --warn-soft: #3a2a10; --vice: #e59acb; --vice-soft: #3a1830;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --fg: #e3ebe8; --muted: #93a39e; --line: #26332f;
  --accent: #46c2a6; --accent-fg: #06201a; --accent-soft: #163a32;
  --chart-rest: #3d8fc0; --chart-vice: #d9742a;
  --neg: #ff8a7a; --pos: #6fd08f; --warn: #f0b45a; --warn-soft: #3a2a10; --vice: #e59acb; --vice-soft: #3a1830;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 6px; }
h1 { font: 600 clamp(1.05rem, 4.8vw, 1.25rem)/1.1 var(--font-head); margin: 0; letter-spacing: .01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
header > * { min-width: 0; }
h1 span { color: var(--accent); }
h2 { font: 600 1rem/1.2 var(--font-head); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-wrap: balance; }
#month-switch { display: flex; align-items: center; gap: 2px; }
#month-label { font-weight: 600; min-width: 7ch; text-align: center; white-space: nowrap; font-size: .92rem; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
.num, .big, input[type=number] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; min-height: 44px; border-radius: 10px; padding: 0 14px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, li.tap:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.ghost { background: var(--surface); border: 1px solid var(--line); }
.danger { background: var(--neg); color: var(--surface); font-weight: 600; }
.link { color: var(--accent); padding: 0; min-height: 36px; font-weight: 600; justify-self: start; }
.icon { min-width: 44px; padding: 0; font-size: 1.3rem; color: var(--muted); }
#month-switch button { min-width: 36px; padding: 0; font-size: 1.2rem; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; font-size: 1.05rem; }
#status { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 12px 14px; margin: 0; font-weight: 500; }

.entry { display: grid; gap: 8px; }
.partial { margin: 0; color: var(--muted); font-style: italic; }
.entry-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mic { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.entry-actions .left { display: flex; gap: 8px; margin-right: auto; }
.mic::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: 1px; }
.mic.live { background: var(--neg); color: var(--surface); }
@media (prefers-reduced-motion: no-preference) { .mic.live::before { animation: pulse 1s infinite alternate; } }
@keyframes pulse { to { opacity: .3; } }
.cards { display: grid; gap: 10px; }
.cards-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cards-head input { width: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; }
.card.unknown { border-color: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > * { min-width: 0; }
.row.nums input[type=number] { flex: 1 1 5ch; }
.row.nums select { flex: 0 0 auto; width: auto; }
.money { position: relative; flex: 1 1 9ch; display: block; }
.money input { padding-right: 44px; }
.money span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .78rem; pointer-events: none; }
.unit { color: var(--muted); }

.stack { display: grid; gap: 14px; }
.balance { background: var(--surface); border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); display: grid; gap: 6px; }
.big { font-size: 2.4rem; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.05; }
.big small { font-size: .9rem; color: var(--muted); font-family: var(--font-body); }
.big.neg { color: var(--neg); } .big.pos { color: var(--pos); }
.ledger { display: grid; grid-template-columns: 1fr auto; margin: 6px 0 0; border-top: 1px dashed var(--line); }
.ledger dt, .ledger dd { margin: 0; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.ledger dt { display: flex; gap: 8px; align-items: center; }
.ledger dd { font-family: var(--font-num); text-align: right; }
.pill { font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; letter-spacing: .02em; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.vice { background: var(--vice-soft); color: var(--vice); }
.panel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
.panel summary { font: 600 1rem var(--font-head); cursor: pointer; min-height: 32px; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bars li { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; cursor: pointer; }
.bar-label { display: flex; gap: 6px; align-items: center; }
.bar-val { font-family: var(--font-num); }
.bar-track { grid-column: 1 / -1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 4px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-height: 44px; }
.list li:last-child { border-bottom: 0; }
.list li > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.list small { display: block; color: var(--muted); font-size: .8rem; }
.list .num { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.list li.tap { cursor: pointer; }
.list li.editor { display: grid; gap: 8px; justify-content: stretch; }
.bills li.paid > .check span { color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; min-width: 0; cursor: pointer; }
.check input { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); }
.amount { padding: 0 6px; min-height: 40px; }
input.inline { width: 11ch; text-align: right; }
.day { font-size: .9rem; color: var(--muted); }
.day::first-letter { text-transform: uppercase; }
.sum { margin: 0; color: var(--muted); }
.sum strong { color: var(--fg); font-family: var(--font-num); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { flex: none; min-height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: .85rem; }
.chips button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.add-income { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px 16px; display: grid; gap: 8px; }
.empty p { margin: 0; }
.head-right { display: flex; align-items: center; gap: 2px; flex: none; }
.gear { min-width: 38px; padding: 0; font-size: 1.25rem; color: var(--muted); position: relative; }
.gear.warn::after { content: ""; position: absolute; top: 9px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.filebtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; cursor: pointer; }
#summary-text { font-size: .8rem; font-family: ui-monospace, Consolas, monospace; }
.stack.tight { gap: 8px; }
.servings { flex: 0 0 8.5ch; }
.servings input { padding-right: 46px; }
.row.qty { gap: 4px; flex: none; }
.row.spread { justify-content: space-between; }
.cost { margin-left: auto; white-space: nowrap; font-weight: 600; }
.list .num small { display: block; text-align: right; }
.list .num:has(small) { flex-direction: column; align-items: flex-end; gap: 0; }
.list li .pill { margin-left: 6px; vertical-align: 1px; }
.warn-text { color: var(--warn); }
.fbar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bg); }
.fseg { display: block; min-width: 3px; }
.fseg.fcooked, .sw.fcooked { background: var(--chart-rest); }
.fseg.fwasted, .sw.fwasted { background: var(--chart-vice); }
.fseg.frest, .sw.frest { background: var(--line); }
.ledger.food dt { flex-wrap: wrap; }
.ledger.food dt small { flex-basis: 100%; color: var(--muted); font-size: .78rem; }
.ledger.food dd small { color: var(--muted); font-size: .78rem; }
h3.eyebrow { margin-top: 4px; }
.tablewrap { overflow-x: auto; }
.ftable { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.ftable th { text-align: right; font-weight: 600; color: var(--muted); font-size: .75rem; padding: 4px 6px; }
.ftable th:first-child, .ftable td:first-child { text-align: left; }
.ftable td { padding: 6px; border-top: 1px solid var(--line); text-align: right; }
.ftable tr.sel td { font-weight: 600; color: var(--fg); background: var(--bg); }
.weeknav strong { font-size: .95rem; }
.weeknav button { min-width: 44px; font-size: 1.1rem; }
.day-plan.today { border-color: var(--accent); }
.day-plan .link.small { justify-self: start; }
.row input[type=date] { flex: 1 1 auto; width: auto; min-width: 0; }
.row.qty .unit { min-width: 2.5ch; }
.row.ing input[type=number] { flex: 0 0 9ch; }
.row.ing input:not([type]) { flex: 1 1 auto; }
button.small { min-height: 34px; padding: 0 10px; font-size: .8rem; }
.tchart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; height: 180px; align-items: end; }
.tbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; padding: 0; min-height: 0; gap: 4px; border-radius: 6px; }
.tcol { width: 70%; max-width: 44px; display: flex; flex-direction: column-reverse; gap: 2px; min-height: 0; }
.seg { display: block; min-height: 2px; }
.seg.rest { background: var(--chart-rest); }
.seg.vice { background: var(--chart-vice); }
.tcol > .seg:last-child { border-radius: 4px 4px 0 0; }
.tbar:not(.sel) .tcol { opacity: .55; }
.tval { font-size: .72rem; font-weight: 600; min-height: 1em; font-variant-numeric: tabular-nums; }
.tlab { font-size: .75rem; color: var(--muted); }
.tbar.sel .tlab { color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.rest { background: var(--chart-rest); } .sw.vice { background: var(--chart-vice); }
.cands li { display: grid; gap: 6px; justify-content: stretch; }
.row.acts { gap: 6px; flex-wrap: wrap; }
.link.small { min-height: 34px; padding: 0 6px; font-size: .8rem; }
.pos-text { color: var(--pos); font-size: .85rem; }
.answer { white-space: pre-wrap; line-height: 1.55; background: var(--bg); border-radius: 10px; padding: 12px; }
.chips button[aria-selected=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

nav { position: fixed; inset: auto 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#tabs { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
#tabs button { min-height: 58px; font-size: .78rem; font-weight: 500; color: var(--muted); padding: 0 2px; border-radius: 0; border-top: 3px solid transparent; }
#tabs button[aria-current=page] { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); font-weight: 500; }
</style>

<div class="wrap">
  <header>
    <h1>Kućni <span>Trošak</span></h1>
    <div class="head-right">
    <div id="month-switch">
      <button type="button" id="prev" aria-label="Prethodni mesec">‹</button>
      <span id="month-label">…</span>
      <button type="button" id="next" aria-label="Sledeći mesec">›</button>
    </div>
    <button type="button" id="settings-btn" class="gear" aria-label="Podešavanja" hidden>⚙</button>
    </div>
  </header>
  <p id="status" role="status" hidden></p>
  <div id="entry-slot" class="stack" hidden></div>
  <main id="view">
    <div class="empty"><p>Učitavam tvoje troškove…</p></div>
  </main>
</div>
<nav aria-label="Glavna navigacija"><div id="tabs"></div></nav>
<div id="toast" role="status" hidden></div>
<script type="module" src="src/app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
